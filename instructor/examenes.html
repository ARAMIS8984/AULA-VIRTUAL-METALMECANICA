<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exámenes - AulaSENA</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .texto-anotable mark.resaltado-amarillo { background:#fff3b0; cursor:help; border-radius:2px; }
  .texto-anotable mark.resaltado-rojo { background:#ffd1d1; cursor:help; border-radius:2px; }
  .texto-anotable mark.resaltado-verde { background:#c8f2cf; cursor:help; border-radius:2px; }
  .btn-color { width:32px; height:32px; border-radius:6px; border:1px solid var(--gris-borde); cursor:pointer; }
  .actividad-tarjeta {
    border: 1px solid var(--gris-borde);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .actividad-titulo { font-weight: 600; }
  .actividad-fechas { font-size: 0.85rem; color: var(--gris-texto); margin-top: 4px; }
  .actividad-desc { font-size: 0.85rem; color: var(--gris-texto); margin-top: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="marca">Aula<span>SENA</span></div>
  <nav>
    <a href="dashboard.html">Fichas</a>
    <a href="asistencia.html">Asistencia</a>
    <a href="material.html">Material</a>
    <a href="examenes.html" class="activo">Exámenes</a>
    <a href="foro.html">Foro</a>
    <a href="calificaciones.html">Calificaciones</a>
    <a href="solicitudes.html">Solicitudes</a>
    <a href="reportes.html">Reportes</a>
  </nav>
  <button class="btn-salir" onclick="cerrarSesionInstructor()">Salir</button>
</div>

<div class="contenedor" style="padding-top:32px; padding-bottom:48px; max-width:720px;">
  <h2 style="margin-bottom:20px;">Calendario de exámenes y actividades</h2>

  <div class="tarjeta" style="margin-bottom:20px;">
    <div class="campo" style="margin-bottom:0;">
      <label for="select-ficha">Ficha</label>
      <select id="select-ficha" onchange="alCambiarFicha()"></select>
    </div>
  </div>

  <div class="tarjeta espaciado-v" style="margin-bottom:24px;">
    <h3 style="margin-bottom:4px; font-size:0.95rem;" id="titulo-formulario">Programar nuevo examen/actividad</h3>
    <input type="hidden" id="id-actividad-editando" value="">
    <input type="text" id="titulo-actividad" placeholder="Título (ej: Examen Torneado CNC - Corte 1)">
    <textarea id="descripcion-actividad" rows="2" placeholder="Instrucciones o descripción (opcional)"></textarea>
    <div class="campo" style="margin-bottom:0;">
      <label for="modalidad-actividad">Modalidad</label>
      <select id="modalidad-actividad" onchange="alCambiarModalidad()">
        <option value="examen_online">📝 Examen en línea (preguntas con puntos)</option>
        <option value="entrega_documento">📎 Entrega de documento (el aprendiz sube un archivo, tú calificas)</option>
        <option value="texto_fotos">✍️ Trabajo escrito + fotos (el aprendiz escribe y sube fotos de lo que hizo)</option>
        <option value="participacion">🗣️ Participación / evaluación directa (tú calificas a cada uno, sin que entreguen nada)</option>
      </select>
    </div>
    <div class="grid-2">
      <div class="campo" style="margin-bottom:0;">
        <label for="fecha-inicio-actividad">Disponible desde</label>
        <input type="datetime-local" id="fecha-inicio-actividad">
      </div>
      <div class="campo" style="margin-bottom:0;">
        <label for="fecha-fin-actividad">Disponible hasta</label>
        <input type="datetime-local" id="fecha-fin-actividad">
      </div>
    </div>
    <div class="campo" style="margin-bottom:0;" id="bloque-tiempo-limite">
      <label for="tiempo-limite-actividad">Tiempo límite en minutos (opcional, solo si aplica)</label>
      <input type="number" id="tiempo-limite-actividad" min="1" placeholder="Ej: 60">
    </div>
    <button class="btn btn-primario" style="width:100%;" id="btn-guardar-actividad" onclick="guardarActividad()">+ Programar</button>
    <button class="btn btn-secundario oculto" style="width:100%;" id="btn-cancelar-edicion" onclick="cancelarEdicion()">Cancelar edición</button>
    <p class="mensaje-error" id="mensaje-error"></p>
    <p class="mensaje-error" id="mensaje-exito" style="background:rgba(57,169,0,0.1); color:var(--verde-oscuro);"></p>
  </div>

  <h3 style="margin-bottom:12px;">Actividades programadas</h3>
  <div id="lista-actividades"><p class="texto-ayuda">Selecciona una ficha.</p></div>
</div>

<script src="../js/supabase-config.js"></script>
<script src="../js/auth.js"></script>
<script>
requerirSesionInstructor();

let actividadesCache = {};

function alCambiarModalidad() {
  const modalidad = document.getElementById('modalidad-actividad').value;
  document.getElementById('bloque-tiempo-limite').style.display = modalidad === 'examen_online' ? '' : 'none';
}

async function cargarFichas() {
  const { data: fichas, error } = await supabaseClient
    .from('fichas')
    .select('id, numero_ficha, programa, nombre_grupo')
    .order('created_at', { ascending: false });

  const select = document.getElementById('select-ficha');
  if (error || !fichas || fichas.length === 0) {
    select.innerHTML = '<option value="">No hay fichas creadas</option>';
    return;
  }
  select.innerHTML = fichas.map(f => `<option value="${f.id}">${f.nombre_grupo ? f.nombre_grupo + ' — ' : ''}Ficha ${f.numero_ficha} · ${f.programa}</option>`).join('');

  const ultimaFichaUsada = localStorage.getItem('aulasena_ultima_ficha');
  if (ultimaFichaUsada && fichas.some(f => f.id === ultimaFichaUsada)) {
    select.value = ultimaFichaUsada;
  }
  alCambiarFicha();
}

function alCambiarFicha() {
  const fichaId = document.getElementById('select-ficha').value;
  if (!fichaId) return;
  localStorage.setItem('aulasena_ultima_ficha', fichaId);
  cargarActividades(fichaId);
}

async function guardarActividad() {
  ocultarMensajes();
  const fichaId = document.getElementById('select-ficha').value;
  const idEditando = document.getElementById('id-actividad-editando').value;
  const titulo = document.getElementById('titulo-actividad').value.trim();
  const descripcion = document.getElementById('descripcion-actividad').value.trim();
  const modalidad = document.getElementById('modalidad-actividad').value;
  const fechaInicioLocal = document.getElementById('fecha-inicio-actividad').value;
  const fechaFinLocal = document.getElementById('fecha-fin-actividad').value;
  const tiempoLimite = document.getElementById('tiempo-limite-actividad').value;

  if (!fichaId) { mostrarError('Selecciona una ficha.'); return; }
  if (!titulo) { mostrarError('El título es obligatorio.'); return; }
  if (!fechaInicioLocal || !fechaFinLocal) { mostrarError('Debes indicar la fecha y hora de inicio y de fin.'); return; }
  if (fechaFinLocal < fechaInicioLocal) { mostrarError('La fecha de fin no puede ser antes que la de inicio.'); return; }

  const datos = {
    ficha_id: fichaId,
    titulo,
    descripcion: descripcion || null,
    modalidad,
    fecha_inicio: new Date(fechaInicioLocal).toISOString(),
    fecha_fin: new Date(fechaFinLocal).toISOString(),
    tiempo_limite_minutos: (modalidad === 'examen_online' && tiempoLimite) ? parseInt(tiempoLimite) : null,
  };

  const { error } = idEditando
    ? await supabaseClient.from('examenes').update(datos).eq('id', idEditando)
    : await supabaseClient.from('examenes').insert(datos);

  if (error) { mostrarError('Error al guardar: ' + error.message); return; }

  mostrarExito(idEditando ? 'Actividad actualizada correctamente.' : 'Actividad programada correctamente.');
  cancelarEdicion();
  cargarActividades(fichaId);
}

// Convierte un ISO timestamp (de la BD) al formato que necesita <input type="datetime-local">
function isoADatetimeLocal(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function editarActividad(a) {
  document.getElementById('id-actividad-editando').value = a.id;
  document.getElementById('titulo-actividad').value = a.titulo;
  document.getElementById('descripcion-actividad').value = a.descripcion || '';
  document.getElementById('modalidad-actividad').value = a.modalidad || 'examen_online';
  document.getElementById('fecha-inicio-actividad').value = isoADatetimeLocal(a.fecha_inicio);
  document.getElementById('fecha-fin-actividad').value = isoADatetimeLocal(a.fecha_fin);
  document.getElementById('tiempo-limite-actividad').value = a.tiempo_limite_minutos || '';
  alCambiarModalidad();

  document.getElementById('titulo-formulario').textContent = 'Editando actividad';
  document.getElementById('btn-guardar-actividad').textContent = 'Guardar cambios';
  document.getElementById('btn-cancelar-edicion').classList.remove('oculto');
  document.getElementById('titulo-actividad').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cancelarEdicion() {
  document.getElementById('id-actividad-editando').value = '';
  document.getElementById('titulo-actividad').value = '';
  document.getElementById('descripcion-actividad').value = '';
  document.getElementById('modalidad-actividad').value = 'examen_online';
  document.getElementById('fecha-inicio-actividad').value = '';
  document.getElementById('fecha-fin-actividad').value = '';
  document.getElementById('tiempo-limite-actividad').value = '';
  alCambiarModalidad();

  document.getElementById('titulo-formulario').textContent = 'Programar nuevo examen/actividad';
  document.getElementById('btn-guardar-actividad').textContent = '+ Programar';
  document.getElementById('btn-cancelar-edicion').classList.add('oculto');
}

async function cargarActividades(fichaId) {
  const cont = document.getElementById('lista-actividades');
  const { data: actividades, error } = await supabaseClient
    .from('examenes')
    .select('*')
    .eq('ficha_id', fichaId)
    .order('fecha_inicio', { ascending: true });

  if (error) { cont.innerHTML = `<p style="color:var(--rojo-error);">${error.message}</p>`; return; }
  if (!actividades || actividades.length === 0) { cont.innerHTML = '<p class="texto-ayuda">Aún no has programado ninguna actividad para esta ficha.</p>'; return; }

  const ahora = new Date();
  actividadesCache = {};

  cont.innerHTML = actividades.map(a => {
    actividadesCache[a.id] = a;
    let estadoTexto = 'Próximamente';
    let estadoClase = 'etiqueta-gris';
    if (a.fecha_fin && ahora > new Date(a.fecha_fin)) { estadoTexto = 'Cerrado'; estadoClase = 'etiqueta-rojo'; }
    else if (a.fecha_inicio && ahora >= new Date(a.fecha_inicio)) { estadoTexto = 'Disponible ahora'; estadoClase = 'etiqueta-verde'; }
    const badgeModalidad = a.modalidad === 'entrega_documento' ? '📎 Entrega de documento' : a.modalidad === 'texto_fotos' ? '✍️ Trabajo escrito + fotos' : a.modalidad === 'participacion' ? '🗣️ Participación / evaluación directa' : '📝 Examen en línea';

    return `
      <div class="actividad-tarjeta">
        <div>
          <div class="actividad-titulo">${a.titulo} <span class="etiqueta ${estadoClase}">${estadoTexto}</span></div>
          <div class="actividad-fechas">${badgeModalidad} · Del ${formatearFecha(a.fecha_inicio)} al ${formatearFecha(a.fecha_fin)}${a.tiempo_limite_minutos ? ` · ${a.tiempo_limite_minutos} min` : ''}</div>
          ${a.descripcion ? `<div class="actividad-desc">${a.descripcion}</div>` : ''}
          <div style="display:flex; gap:10px; margin-top:8px;">
            <button class="btn btn-secundario" style="font-size:0.75rem; padding:5px 10px;" onclick="editarActividad(actividadesCache['${a.id}'])">Editar</button>
            <button class="btn btn-secundario" style="font-size:0.75rem; padding:5px 10px;" onclick="verResultados('${a.id}')">Ver resultados</button>
          </div>
        </div>
        <button onclick="eliminarActividad('${a.id}')" style="border:none; background:none; color:var(--rojo-error); cursor:pointer; font-size:0.78rem; flex-shrink:0;">Eliminar</button>
      </div>
      <div id="resultados-${a.id}" class="oculto" style="margin:-4px 0 14px; padding-left:4px;"></div>
    `;
  }).join('');
}

async function verResultados(examenId) {
  const cont = document.getElementById(`resultados-${examenId}`);
  const visible = !cont.classList.contains('oculto');
  document.querySelectorAll('[id^="resultados-"]').forEach(el => el.classList.add('oculto'));
  if (visible) return;
  cont.classList.remove('oculto');
  cont.innerHTML = '<p class="texto-ayuda">Cargando resultados...</p>';

  const actividad = actividadesCache[examenId];
  const esDocumento = actividad?.modalidad === 'entrega_documento';
  const esTextoFotos = actividad?.modalidad === 'texto_fotos';
  const esParticipacion = actividad?.modalidad === 'participacion';

  if (esParticipacion) {
    const { data: aprendices, error: errAp } = await supabaseClient
      .from('aprendices')
      .select('id, nombre_completo')
      .eq('ficha_id', actividad.ficha_id)
      .order('nombre_completo');

    if (errAp) { cont.innerHTML = `<p style="color:var(--rojo-error);">${errAp.message}</p>`; return; }

    const { data: resultadosExistentes } = await supabaseClient
      .from('resultados_examen')
      .select('*')
      .eq('examen_id', examenId);

    const mapaResultados = {};
    (resultadosExistentes || []).forEach(r => { mapaResultados[r.aprendiz_id] = r; });

    cont.innerHTML = (aprendices || []).map(ap => {
      const r = mapaResultados[ap.id];
      const etiquetaTexto = r?.no_presentado ? 'No presentado' : (r?.revisado ? `Nota: ${r.puntaje_obtenido}` : 'Sin calificar');
      const etiquetaClase = r?.no_presentado ? 'etiqueta-rojo' : (r?.revisado ? 'etiqueta-verde' : 'etiqueta-gris');
      return `
        <div class="tarjeta espaciado-v" style="margin-bottom:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <strong>${ap.nombre_completo}</strong>
            <span class="etiqueta ${etiquetaClase}" id="pbadge-${ap.id}">${etiquetaTexto}</span>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center;">
            <input type="number" id="part-nota-${ap.id}" min="0" max="100" placeholder="Nota 0-100" value="${(!r?.no_presentado && r?.puntaje_obtenido != null) ? r.puntaje_obtenido : ''}" oninput="programarGuardadoParticipacion('${ap.id}', '${examenId}')" style="width:110px;">
            <input type="text" id="part-comentario-${ap.id}" placeholder="Comentario (opcional)" value="${r?.comentario_instructor || ''}" oninput="programarGuardadoParticipacion('${ap.id}', '${examenId}')" style="flex:1; min-width:160px;">
            <label style="display:flex; align-items:center; gap:4px; font-size:0.8rem; font-weight:400; cursor:pointer;">
              <input type="checkbox" id="part-nopresentado-${ap.id}" ${r?.no_presentado ? 'checked' : ''} onchange="guardarParticipacion('${ap.id}', '${examenId}')"> No presentado
            </label>
            <span id="guardado-p-${ap.id}" style="font-size:0.75rem; min-width:60px;"></span>
          </div>
        </div>
      `;
    }).join('');
    return;
  }

  const { data: resultados, error } = await supabaseClient
    .from('resultados_examen')
    .select('*, aprendices(nombre_completo)')
    .eq('examen_id', examenId)
    .order('fecha_presentacion', { ascending: false });

  if (error) { cont.innerHTML = `<p style="color:var(--rojo-error);">${error.message}</p>`; return; }
  if (!resultados || resultados.length === 0) { cont.innerHTML = `<p class="texto-ayuda">Nadie ha ${(esDocumento || esTextoFotos) ? 'entregado' : 'presentado'} esta actividad todavía.</p>`; return; }

  cont.innerHTML = resultados.map(r => `
    <div class="tarjeta espaciado-v" style="margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong>${r.aprendices?.nombre_completo || 'Aprendiz'}</strong>
        <span class="etiqueta ${r.revisado ? 'etiqueta-verde' : 'etiqueta-gris'}" id="badge-${r.id}">${r.revisado ? `Nota: ${r.puntaje_obtenido}` : 'Pendiente de revisión'}</span>
      </div>
      ${esDocumento ? `
        <div style="border-top:1px solid var(--gris-borde); padding-top:8px; margin-top:8px; font-size:0.85rem;">
          ${r.url_documento ? `<a href="${r.url_documento}" target="_blank" rel="noopener">📎 Ver documento entregado</a>` : '<em>Sin documento</em>'}
        </div>
      ` : esTextoFotos ? `
        <div style="border-top:1px solid var(--gris-borde); padding-top:8px; margin-top:8px; font-size:0.85rem;">
          <div class="leyenda-resaltado" style="font-size:0.72rem; color:var(--gris-texto); margin-bottom:4px;">🟡 Mejorar · 🔴 Error · 🟢 Bien hecho — selecciona texto y toca un color (se guarda solo)</div>
          <div id="texto-anot-${r.id}" class="texto-anotable" data-original="${escapeAttr(r.texto_respuesta || '')}" style="white-space:pre-wrap; line-height:1.5; padding:6px 0;">${r.texto_respuesta_anotado || escapeHtml(r.texto_respuesta || '').replace(/\n/g, '<br>')}</div>
          <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; align-items:center;">
            <button type="button" class="btn-color" style="background:#fff3b0;" onclick="resaltarSeleccion('texto-anot-${r.id}', 'amarillo', 'texto', '${r.id}')" title="Resaltar amarillo (mejorar)">🟡</button>
            <button type="button" class="btn-color" style="background:#ffd1d1;" onclick="resaltarSeleccion('texto-anot-${r.id}', 'rojo', 'texto', '${r.id}')" title="Resaltar rojo (error)">🔴</button>
            <button type="button" class="btn-color" style="background:#c8f2cf;" onclick="resaltarSeleccion('texto-anot-${r.id}', 'verde', 'texto', '${r.id}')" title="Resaltar verde (bien hecho)">🟢</button>
            <button type="button" class="btn btn-secundario" style="font-size:0.75rem; padding:4px 10px;" onclick="deshacerResaltado('texto-anot-${r.id}', 'texto', '${r.id}')">Deshacer resaltados</button>
            <span id="guardado-${r.id}" style="font-size:0.75rem;"></span>
          </div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
            ${(r.fotos_urls || []).map(url => `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" loading="lazy" style="width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid var(--gris-borde);"></a>`).join('')}
          </div>
        </div>
      ` : (r.respuestas || []).map((resp, idx) => `
        <div style="border-top:1px solid var(--gris-borde); padding-top:8px; margin-top:8px; font-size:0.85rem;">
          <p style="margin:0 0 2px; color:var(--gris-texto);">${resp.enunciado}</p>
          ${resp.tipo === 'abierta' ? `
            <div class="leyenda-resaltado" style="font-size:0.72rem; color:var(--gris-texto); margin-bottom:4px;">🟡 Mejorar · 🔴 Error · 🟢 Bien hecho (se guarda solo)</div>
            <div id="resp-anot-${r.id}-${idx}" class="texto-anotable" data-original="${escapeAttr(resp.respuesta || '')}" style="white-space:pre-wrap; line-height:1.5; padding:4px 0;">${resp.respuesta_anotada || escapeHtml(resp.respuesta || '<em>Sin responder</em>').replace(/\n/g, '<br>')}</div>
            <div style="display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; align-items:center;">
              <button type="button" class="btn-color" style="background:#fff3b0;" onclick="resaltarSeleccion('resp-anot-${r.id}-${idx}', 'amarillo', 'respuesta', '${r.id}', ${idx})" title="Resaltar amarillo (mejorar)">🟡</button>
              <button type="button" class="btn-color" style="background:#ffd1d1;" onclick="resaltarSeleccion('resp-anot-${r.id}-${idx}', 'rojo', 'respuesta', '${r.id}', ${idx})" title="Resaltar rojo (error)">🔴</button>
              <button type="button" class="btn-color" style="background:#c8f2cf;" onclick="resaltarSeleccion('resp-anot-${r.id}-${idx}', 'verde', 'respuesta', '${r.id}', ${idx})" title="Resaltar verde (bien hecho)">🟢</button>
              <button type="button" class="btn btn-secundario" style="font-size:0.75rem; padding:4px 10px;" onclick="deshacerResaltado('resp-anot-${r.id}-${idx}', 'respuesta', '${r.id}', ${idx})">Deshacer resaltados</button>
              <span id="guardado-${r.id}-${idx}" style="font-size:0.75rem;"></span>
            </div>
          ` : `<p style="margin:0;">${resp.respuesta || '<em>Sin responder</em>'} ${resp.tipo === 'opcion_multiple' ? (resp.correcta ? '✅' : '❌') : ''}</p>`}
        </div>
      `).join('')}
      ${r.comentario_instructor ? `<p style="margin:8px 0 0; font-size:0.82rem; color:var(--gris-texto);"><strong>Tu comentario:</strong> ${r.comentario_instructor}</p>` : ''}
      <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; align-items:center;">
        <input type="number" id="nota-manual-${r.id}" min="0" max="100" placeholder="Nota 0-100" value="${r.puntaje_obtenido != null ? r.puntaje_obtenido : ''}" oninput="programarGuardadoNota('${r.id}', '${examenId}')" style="width:110px;">
        <input type="text" id="comentario-manual-${r.id}" placeholder="Comentario (opcional)" value="${r.comentario_instructor || ''}" oninput="programarGuardadoNota('${r.id}', '${examenId}')" style="flex:1; min-width:160px;">
        <span id="guardado-nota-${r.id}" style="font-size:0.75rem; min-width:60px;"></span>
      </div>
    </div>
  `).join('');
}

function escapeHtml(texto) {
  const div = document.createElement('div');
  div.textContent = texto || '';
  return div.innerHTML;
}

function escapeAttr(texto) {
  return (texto || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mostrarEstadoGuardado(id, texto, esError) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = texto;
  el.style.color = esError ? 'var(--rojo-error)' : '#2f9e44';
  clearTimeout(el._temporizador);
  el._temporizador = setTimeout(() => { el.textContent = ''; }, 2000);
}

async function resaltarSeleccion(containerId, color, tipo, resultadoId, indice) {
  const contenedor = document.getElementById(containerId);
  const seleccion = window.getSelection();
  if (!seleccion || seleccion.rangeCount === 0 || seleccion.isCollapsed) {
    alert('Primero selecciona el texto que quieres resaltar.');
    return;
  }
  const rango = seleccion.getRangeAt(0);
  if (!contenedor.contains(rango.commonAncestorContainer)) {
    alert('Selecciona texto dentro de la respuesta del aprendiz.');
    return;
  }
  const comentario = (prompt('Comentario para esta parte (opcional):') || '').trim();
  const marca = document.createElement('mark');
  marca.className = `resaltado-${color}`;
  if (comentario) marca.title = comentario;
  try {
    rango.surroundContents(marca);
  } catch (e) {
    const contenido = rango.extractContents();
    marca.appendChild(contenido);
    rango.insertNode(marca);
  }
  seleccion.removeAllRanges();
  await guardarResaltado(tipo, resultadoId, indice);
}

async function deshacerResaltado(containerId, tipo, resultadoId, indice) {
  if (!confirm('¿Quitar todos los resaltados de este texto?')) return;
  const contenedor = document.getElementById(containerId);
  const original = contenedor.dataset.original || '';
  contenedor.innerHTML = escapeHtml(original).replace(/\n/g, '<br>');
  await guardarResaltado(tipo, resultadoId, indice);
}

async function guardarResaltado(tipo, resultadoId, indice) {
  if (tipo === 'texto') {
    const contenedor = document.getElementById(`texto-anot-${resultadoId}`);
    const { error } = await supabaseClient.from('resultados_examen').update({ texto_respuesta_anotado: contenedor.innerHTML }).eq('id', resultadoId);
    mostrarEstadoGuardado(`guardado-${resultadoId}`, error ? 'Error al guardar' : '✓ Guardado', !!error);
  } else {
    const contenedor = document.getElementById(`resp-anot-${resultadoId}-${indice}`);
    const { data: actual, error: errFetch } = await supabaseClient.from('resultados_examen').select('respuestas').eq('id', resultadoId).single();
    if (errFetch || !actual) { mostrarEstadoGuardado(`guardado-${resultadoId}-${indice}`, 'Error al guardar', true); return; }
    const respuestas = actual.respuestas || [];
    if (!respuestas[indice]) { mostrarEstadoGuardado(`guardado-${resultadoId}-${indice}`, 'Error al guardar', true); return; }
    respuestas[indice].respuesta_anotada = contenedor.innerHTML;
    const { error } = await supabaseClient.from('resultados_examen').update({ respuestas }).eq('id', resultadoId);
    mostrarEstadoGuardado(`guardado-${resultadoId}-${indice}`, error ? 'Error al guardar' : '✓ Guardado', !!error);
  }
}

let temporizadoresGuardado = {};

function programarGuardadoNota(resultadoId, examenId) {
  clearTimeout(temporizadoresGuardado[resultadoId]);
  temporizadoresGuardado[resultadoId] = setTimeout(() => guardarNotaManual(resultadoId, examenId), 700);
}

async function guardarNotaManual(resultadoId, examenId) {
  const nota = document.getElementById(`nota-manual-${resultadoId}`).value;
  const comentario = document.getElementById(`comentario-manual-${resultadoId}`)?.value.trim() || null;
  const datos = { comentario_instructor: comentario };
  if (nota !== '') { datos.puntaje_obtenido = parseFloat(nota); datos.revisado = true; }
  const { error } = await supabaseClient.from('resultados_examen').update(datos).eq('id', resultadoId);
  mostrarEstadoGuardado(`guardado-nota-${resultadoId}`, error ? 'Error al guardar' : '✓ Guardado', !!error);
  if (!error) {
    const badge = document.getElementById(`badge-${resultadoId}`);
    if (badge && nota !== '') {
      badge.textContent = `Nota: ${nota}`;
      badge.className = 'etiqueta etiqueta-verde';
    }
  }
}

function programarGuardadoParticipacion(aprendizId, examenId) {
  clearTimeout(temporizadoresGuardado[aprendizId]);
  temporizadoresGuardado[aprendizId] = setTimeout(() => guardarParticipacion(aprendizId, examenId), 700);
}

async function guardarParticipacion(aprendizId, examenId) {
  const nota = document.getElementById(`part-nota-${aprendizId}`).value;
  const comentario = document.getElementById(`part-comentario-${aprendizId}`).value.trim() || null;
  const noPresentado = document.getElementById(`part-nopresentado-${aprendizId}`).checked;

  if (!noPresentado && nota === '') { return; }

  const { error } = await supabaseClient.from('resultados_examen').upsert({
    examen_id: examenId,
    aprendiz_id: aprendizId,
    puntaje_obtenido: noPresentado ? null : parseFloat(nota),
    no_presentado: noPresentado,
    comentario_instructor: comentario,
    revisado: true,
  }, { onConflict: 'examen_id,aprendiz_id' });

  mostrarEstadoGuardado(`guardado-p-${aprendizId}`, error ? 'Error al guardar' : '✓ Guardado', !!error);
  if (!error) {
    const badge = document.getElementById(`pbadge-${aprendizId}`);
    if (badge) {
      badge.textContent = noPresentado ? 'No presentado' : `Nota: ${nota}`;
      badge.className = `etiqueta ${noPresentado ? 'etiqueta-rojo' : 'etiqueta-verde'}`;
    }
  }
}

function formatearFecha(fecha) {
  if (!fecha) return '—';
  return new Date(fecha).toLocaleString('es-CO', { day: '2-digit', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

async function eliminarActividad(id) {
  if (!confirm('¿Eliminar esta actividad programada?')) return;
  const { error } = await supabaseClient.from('examenes').delete().eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  cargarActividades(document.getElementById('select-ficha').value);
}

function mostrarError(texto) {
  const el = document.getElementById('mensaje-error');
  el.textContent = texto;
  el.classList.add('visible');
}
function mostrarExito(texto) {
  const el = document.getElementById('mensaje-exito');
  el.textContent = texto;
  el.classList.add('visible');
}
function ocultarMensajes() {
  document.getElementById('mensaje-error').classList.remove('visible');
  document.getElementById('mensaje-exito').classList.remove('visible');
}

cargarFichas();
</script>
